# SQL Server 2022 for LegacyMigrator. Start with: docker compose up -d
# MSSQL_PASSWORD is read from .env in this folder (never committed).
# Apple chip Macs: turn on Docker Desktop's Rosetta setting first, or SQL Server crashes.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: sql2022
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    # "docker compose ps" shows healthy once SQL Server answers queries (takes ~30 s)
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mssql-data:
